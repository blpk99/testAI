<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Trash Bin – Stable BLE + Pose AI</title>

  <!-- TFJS -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>

  <!-- TeachableMachine POSE (ถูกต้องที่สุดสำหรับ HandUp/Left/Right) -->
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

</head>

<body>

<h2>AI Trash Bin – Pose AI + Bluetooth Stable</h2>

<button onclick="connectMicrobit()">🔵 Connect micro:bit</button>
<button onclick="startAI()">📷 Start AI Pose Detection</button>

<p id="status">Status: Not connected</p>
<p id="result">---</p>

<script>
// --------------------------------------------------
// CONFIG
// --------------------------------------------------
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/ie3j8Y26K/";
const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const UART_TX      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

let device = null;
let txChar = null;
let model, webcam;

let lastCmd = "";
let lastSendTime = 0;

// ------------------------
// BLE Write Queue
// ------------------------
let bleQueue = [];
let bleBusy = false;

function queueBLE(message) {
  bleQueue.push(message + "\n");
  processBLEQueue();
}

async function processBLEQueue() {
  if (bleBusy || bleQueue.length === 0 || !txChar) return;

  bleBusy = true;
  const msg = bleQueue.shift();

  try {
    // ใช้ writeValue() แทน writeValueWithoutResponse()
    await txChar.writeValue(new TextEncoder().encode(msg));
  } catch (e) {
    console.warn("BLE write failed:", e);
  }

  setTimeout(() => {
    bleBusy = false;
    processBLEQueue();
  }, 150); // รอ 150ms ป้องกัน GATT error
}


// --------------------------------------------------
// CONNECT MICROBIT
// --------------------------------------------------
async function connectMicrobit() {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "BBC micro:bit" }],
      optionalServices: [UART_SERVICE]
    });

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(UART_SERVICE);
    txChar = await service.getCharacteristic(UART_TX);

    document.getElementById("status").innerText =
      "micro:bit Connected ✔ UART Ready";

  } catch (err) {
    document.getElementById("status").innerText = "Connect Error: " + err;
  }
}


// --------------------------------------------------
// START AI POSE
// --------------------------------------------------
async function startAI() {
  document.getElementById("status").innerText = "Loading Pose model...";

  await tf.ready();

  // IMPORTANT: use tmPose not tmImage
  model = await tmPose.load(
    MODEL_URL + "model.json",
    MODEL_URL + "metadata.json"
  );

  document.getElementById("status").innerText = "Model Loaded ✔ Starting camera...";

  // Create webcam
  webcam = new tmPose.Webcam(300, 300, true);
  await webcam.setup();
  await webcam.play();

  document.body.appendChild(webcam.canvas);

  loop();
}


// --------------------------------------------------
// AI LOOP
// --------------------------------------------------
async function loop() {
  webcam.update();

  const { posenetOutput } = await model.estimatePose(webcam.canvas);
  const prediction = await model.predict(posenetOutput);

  const best = prediction.reduce((a, b) =>
    a.probability > b.probability ? a : b
  );

  document.getElementById("result").innerText =
    `${best.className} : ${best.probability.toFixed(2)}`;

  sendCmd(best.className);

  requestAnimationFrame(loop);
}


// --------------------------------------------------
// SEND COMMAND VIA QUEUE
// --------------------------------------------------
function sendCmd(label) {
  if (!txChar || !device.gatt.connected) return;

  let cmd = "S";
  if (label === "HandUp") cmd = "F";
  else if (label === "HandLeft") cmd = "L";
  else if (label === "HandRight") cmd = "R";

  const now = Date.now();

  if (cmd !== lastCmd || now - lastSendTime > 400) {
    queueBLE(cmd);
    lastCmd = cmd;
    lastSendTime = now;
  }
}

</script>

</body>
</html>
