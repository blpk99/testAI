<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Test Microbit</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f4; }
        button { padding: 15px 25px; font-size: 20px; margin: 10px; cursor: pointer; border-radius: 10px; border: none; color: white; }
        .btn-connect { background: #007bff; }
        .btn-camera { background: #28a745; }
        .btn-test { background: #ffc107; color: black; border: 2px solid #333; } /* ปุ่มทดสอบ */
        #status { font-weight: bold; margin-top: 20px; font-size: 18px; }
        #console-log { 
            background: #333; color: #0f0; padding: 10px; 
            text-align: left; height: 150px; overflow-y: scroll; 
            margin-top: 20px; font-family: monospace; 
        }
    </style>
</head>
<body>

    <h2>🤖 Micro:bit AI Tester (Manual Debug)</h2>

    <button class="btn-connect" onclick="connectMicrobit()">1. เชื่อมต่อ Bluetooth</button>
    <button class="btn-camera" onclick="startAI()">2. เปิดกล้อง AI</button>
    <br>
    <button class="btn-test" onclick="sendCmd('F')">🛠️ กดปุ่มนี้เพื่อทดสอบส่ง F</button>

    <div id="status">สถานะ: รอการเชื่อมต่อ...</div>
    <div id="result-text">AI Result: -</div>
    
    <div id="console-log">System Log...</div>

    <div id="webcam-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

    <script>
        const MODEL_URL = "https://teachablemachine.withgoogle.com/models/ie3j8Y26K/";
        
        // UUID มาตรฐานของ Nordic UART
        const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_TX      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

        let device, txChar, model, webcam, maxPredictions;
        let isConnected = false;
        let lastSent = "";

        function log(msg) {
            const logBox = document.getElementById("console-log");
            logBox.innerHTML += `<div>> ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
            console.log(msg);
        }

        async function connectMicrobit() {
            try {
                log("กำลังค้นหา Micro:bit...");
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "BBC micro:bit" }],
                    optionalServices: [UART_SERVICE]
                });

                log("กำลังเชื่อมต่อ GATT Server...");
                const server = await device.gatt.connect();

                log("กำลังหา Service UART...");
                const service = await server.getPrimaryService(UART_SERVICE);

                log("กำลังหา Characteristic TX...");
                txChar = await service.getCharacteristic(UART_TX);

                isConnected = true;
                log("✅ เชื่อมต่อสำเร็จ! พร้อมส่งข้อมูล");
                document.getElementById("status").innerText = "✅ Connected!";
                document.getElementById("status").style.color = "green";
                
                // ลองส่งค่าทักทายทันที
                sendCmd("S");

            } catch (err) {
                log("❌ Error: " + err);
                document.getElementById("status").innerText = "❌ เชื่อมต่อไม่ได้: " + err;
            }
        }

        async function sendCmd(cmd) {
            if (!isConnected || !txChar) {
                log("⚠️ ยังไม่ได้เชื่อมต่อ Bluetooth!");
                return;
            }

            try {
                let message = cmd + "#"; // รูปแบบที่ถูกต้อง
                let encoder = new TextEncoder();
                
                // --- 🛠️ สูตรแก้: ส่งย้ำ 3 รอบ เพื่อความชัวร์ ---
                log(`กำลังพยายามส่ง ${cmd}...`);
                
                for (let i = 0; i < 3; i++) {
                    await txChar.writeValueWithoutResponse(encoder.encode(message));
                    await new Promise(r => setTimeout(r, 50)); // เว้นจังหวะนิดนึง 50ms
                }
                // ----------------------------------------
                
                log(`📤 ส่งข้อมูล: ${message} (ย้ำ 3 ครั้ง) สำเร็จ`);
            } catch (err) {
                log("❌ ส่งไม่ไป: " + err);
            }
        }

        async function startAI() {
            if (!model) {
                log("กำลังโหลด Model...");
                const modelURL = MODEL_URL + "model.json";
                const metadataURL = MODEL_URL + "metadata.json";
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();
            }

            const flip = true; 
            webcam = new tmImage.Webcam(300, 300, flip);
            await webcam.setup();
            await webcam.play();
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            window.requestAnimationFrame(loop);
            log("📸 กล้องเริ่มทำงาน");
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let highestProb = 0;
            let bestClass = "";
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProb) {
                    highestProb = prediction[i].probability;
                    bestClass = prediction[i].className;
                }
            }

            document.getElementById("result-text").innerText = `${bestClass} (${(highestProb * 100).toFixed(0)}%)`;

            // ส่งข้อมูลเมื่อมั่นใจ > 90% และไม่ซ้ำค่าเดิม
            if (highestProb > 0.90 && bestClass !== lastSent) {
                if (bestClass === "HandUp") { sendCmd("F"); lastSent = "HandUp"; }
                else if (bestClass === "HandLeft") { sendCmd("L"); lastSent = "HandLeft"; }
                else if (bestClass === "HandRight") { sendCmd("R"); lastSent = "HandRight"; }
            }
        }
    </script>
</body>
</html>
