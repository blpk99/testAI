<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Control</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #eee; }
        button { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border-radius: 10px; border: none; color: white; cursor: pointer; }
        .btn-blue { background: #007bff; }
        .btn-yellow { background: #ffc107; color: black; }
        #log { background: #000; color: #0f0; padding: 10px; height: 200px; overflow-y: scroll; text-align: left; margin-top: 10px; font-family: monospace; }
    </style>
</head>
<body>

    <h2>🛠️ Manual Test (No Auto-Send)</h2>
    
    <button class="btn-blue" onclick="connect()">1. เชื่อมต่อ (Connect Only)</button>
    <button class="btn-yellow" onclick="send('F')">2. กดส่ง F (Manual)</button>

    <div id="log">Ready...</div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_UUID    = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        let device, char;

        function log(msg) { 
            const d = new Date().toLocaleTimeString();
            document.getElementById("log").innerHTML += `<div>[${d}] ${msg}</div>`; 
        }

        async function connect() {
            try {
                log("Searching...");
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "BBC micro:bit" }],
                    optionalServices: [SERVICE_UUID]
                });
                
                log("Connecting GATT...");
                const server = await device.gatt.connect();
                
                log("Getting Service...");
                const service = await server.getPrimaryService(SERVICE_UUID);
                
                log("Getting Characteristic...");
                char = await service.getCharacteristic(CHAR_UUID);
                
                log("✅ Connected! (Waiting for command)");
                // ⚠️ ไม่มีการส่งข้อมูลอัตโนมัติที่นี่ ปล่อยให้ระบบนิ่งๆ
                
            } catch (e) { log("❌ Connect Error: " + e); }
        }

        async function sendCmd(cmd) {
            if (!isConnected || !txChar) {
                console.log("⚠️ ยังไม่เชื่อมต่อ");
                return;
            }

            let message = cmd + "#"; 
            let encoder = new TextEncoder();
            let data = encoder.encode(message);

            console.log(`กำลังส่ง ${cmd}...`);

            try {
                // 🕵️‍♂️ เลียนแบบแอป: ตรวจสอบคุณสมบัติก่อนส่ง
                if (txChar.properties.writeWithoutResponse) {
                    // ถ้า Micro:bit ชอบแบบ "ไม่รอตอบรับ" (ส่วนใหญ่เป็นอันนี้)
                    await txChar.writeValueWithoutResponse(data);
                    console.log("✅ ส่งแบบ WithoutResponse สำเร็จ");
                } 
                else if (txChar.properties.write) {
                    // ถ้า Micro:bit ชอบแบบ "รอตอบรับ"
                    await txChar.writeValue(data);
                    console.log("✅ ส่งแบบ Write(Response) สำเร็จ");
                } 
                else {
                    throw new Error("ไม่พบช่องทางส่งข้อมูลที่รองรับ");
                }

                // อัปเดตหน้าจอ (ถ้ามี element นี้)
                if(document.getElementById("sent-cmd")) {
                    document.getElementById("sent-cmd").innerText = "ส่งแล้ว: " + message;
                }

            } catch (err) {
                console.error("❌ ส่งพลาด:", err);
                if(document.getElementById("status")) {
                    document.getElementById("status").innerText = "⚠️ ส่งไม่ได้: " + err;
                }
                
                // 🚑 แผนสำรอง: ถ้าส่งไม่ไป ให้ลองอีกแบบ (Brute Force)
                try {
                    console.log("🚑 ลองแผนสำรอง...");
                    await txChar.writeValue(data);
                } catch(e2) {
                    console.error("☠️ แผนสำรองก็ไม่รอด:", e2);
                }
            }
        }
    </script>
</body>
</html>
