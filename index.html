<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>AI + micro:bit Pose Control</title>

<!-- Teachable Machine Pose -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

<style>
button { padding:10px; margin:5px; font-size:16px; }
#label { font-size:22px; font-weight:bold; color:blue; }
</style>
</head>

<body>
<h2>AI Pose + micro:bit Bluetooth</h2>

<button onclick="connectBT()">Connect micro:bit</button>
<button onclick="startAI()">Start AI</button>

<br><br>

<button onclick="sendCmd('F')">Test F</button>
<button onclick="sendCmd('L')">Test L</button>
<button onclick="sendCmd('R')">Test R</button>

<p id="label">Status: -</p>

<video id="webcam" width="300" autoplay playsinline></video>

<script>
let device;
let server;
let uartService;
let uartRX;
let model;
let webcam;
let predictedClass = "";

// ============== BLUETOOTH CONNECT =====================
async function connectBT() {
    try {
        device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: "BBC micro:bit" }],
            optionalServices: ["6e400001-b5a3-f393-e0a9-e50e24dcca9e"]
        });

        server = await device.gatt.connect();
        uartService = await server.getPrimaryService("6e400001-b5a3-f393-e0a9-e50e24dcca9e");
        uartRX = await uartService.getCharacteristic("6e400002-b5a3-f393-e0a9-e50e24dcca9e");

        document.getElementById("label").innerText = "Connected!";
    } 
    catch (err) {
        console.error(err);
        alert("Bluetooth Error: " + err);
    }
}

// ============== SEND COMMAND =====================
async function sendCmd(cmd) {
    if (!uartRX) return alert("Not connected!");

    try {
        await uartRX.writeValue(new TextEncoder().encode(cmd));
        console.log("SEND:", cmd);
    } catch (err) {
        console.error("Write Error:", err);
    }
}

// ============== LOAD + START AI =====================
async function startAI() {

    const URL = "model/"; // เปลี่ยนเป็นโฟลเดอร์โมเดลของคุณ

    model = await tmPose.load(
        URL + "model.json",
        URL + "metadata.json"
    );

    const size = 300;
    const flip = true;

    webcam = new tmPose.Webcam(size, size, flip);
    await webcam.setup();
    await webcam.play();

    document.getElementById("webcam").srcObject = webcam.webcam;
    window.requestAnimationFrame(loop);
}

async function loop() {
    webcam.update();
    await predict();
    window.requestAnimationFrame(loop);
}

// ============== AI PREDICT =====================
async function predict() {
    const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
    const prediction = await model.predict(posenetOutput);

    prediction.forEach(p => {
        if (p.probability > 0.80) {
            predictedClass = p.className;
        }
    });

    document.getElementById("label").innerText = predictedClass;

    // ส่งคำสั่งตาม AI
    if (predictedClass === "HandUp") sendCmd("F");
    if (predictedClass === "Left") sendCmd("L");
    if (predictedClass === "Right") sendCmd("R");
}
</script>

</body>
</html>
