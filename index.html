<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>AI Trash Bin</title>
</head>
<body>

<h2>AI Trash Bin (Hand Up Detection)</h2>
<button onclick="init()">Start Camera</button>
<p id="result">---</p>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>
const URL = "https://teachablemachine.withgoogle.com/models/x3r1TSRf3/";
let model, webcam;

async function init() {
  const modelURL = URL + "model.json";
  const metadataURL = URL + "metadata.json";

  model = await tmImage.load(modelURL, metadataURL);

  webcam = new tmImage.Webcam(300, 300, true);
  await webcam.setup();
  await webcam.play();

  document.body.appendChild(webcam.canvas);
  window.requestAnimationFrame(loop);
}

async function loop() {
  webcam.update();
  const prediction = await model.predict(webcam.canvas);

  document.getElementById("result").innerText =
    prediction[0].className + " : " +
    prediction[0].probability.toFixed(2);

  window.requestAnimationFrame(loop);
}
</script>

</body>
</html>
