<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Control (Fixed)</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #eee; }
        button { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border-radius: 10px; border: none; color: white; cursor: pointer; }
        .btn-blue { background: #007bff; }
        .btn-yellow { background: #ffc107; color: black; }
        #log { background: #000; color: #0f0; padding: 10px; height: 200px; overflow-y: scroll; text-align: left; margin-top: 10px; font-family: monospace; }
    </style>
</head>
<body>

    <h2>🛠️ Manual Test (Fixed)</h2>
    
    <button class="btn-blue" onclick="connect()">1. เชื่อมต่อ (Connect)</button>
    <button class="btn-yellow" onclick="send('F')">2. กดส่ง F (Manual)</button>

    <div id="log">Ready...</div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_UUID    = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        
        // ประกาศตัวแปร Global ให้ใช้ได้ทุกที่
        let device, txChar;

        function log(msg) { 
            const d = new Date().toLocaleTimeString();
            document.getElementById("log").innerHTML += `<div>[${d}] ${msg}</div>`; 
        }

        async function connect() {
            try {
                log("🔍 Searching...");
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "BBC micro:bit" }],
                    optionalServices: [SERVICE_UUID]
                });
                
                log("🔗 Connecting GATT...");
                const server = await device.gatt.connect();
                
                log("📂 Getting Service...");
                const service = await server.getPrimaryService(SERVICE_UUID);
                
                log("📝 Getting Characteristic...");
                // เก็บค่าลงตัวแปร txChar (เพื่อให้ฟังก์ชัน send เรียกใช้ได้)
                txChar = await service.getCharacteristic(CHAR_UUID);
                
                log("✅ Connected! (Waiting for command)");
                
            } catch (e) { log("❌ Connect Error: " + e); }
        }

        async function send(cmd) {
            // เช็คว่าเชื่อมต่อหรือยัง โดยดูว่ามี txChar ไหม
            if (!txChar) {
                log("⚠️ ยังไม่เชื่อมต่อ (Not Connected)");
                return;
            }

            let message = cmd + "#"; 
            let encoder = new TextEncoder();
            let data = encoder.encode(message);

            log(`📤 Attempting to send: ${cmd}...`);

            try {
                // 🕵️‍♂️ Logic ความฉลาด: เช็คว่า Micro:bit รับแบบไหน
                if (txChar.properties.writeWithoutResponse) {
                    await txChar.writeValueWithoutResponse(data);
                    log("✅ Sent (WithoutResponse)");
                } 
                else if (txChar.properties.write) {
                    await txChar.writeValue(data);
                    log("✅ Sent (WriteWithResponse)");
                } 
                else {
                    throw new Error("No write property found");
                }

            } catch (err) {
                log("❌ Error 1: " + err);
                
                // 🚑 แผนสำรอง: ถ้าส่งไม่ไป ให้ลองอีกแบบ
                try {
                    log("🚑 Retrying with alternative mode...");
                    await txChar.writeValue(data);
                    log("✅ Sent (Retry Success)");
                } catch(e2) {
                    log("☠️ Final Error: " + e2);
                }
            }
        }
    </script>
</body>
</html>
