<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Trash Bin – Bluetooth + AI (Stable)</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    button { margin: 5px; padding: 10px 20px; font-size: 18px; }
  </style>
</head>

<body>

<h2>AI Trash Bin – AI + micro:bit Bluetooth</h2>

<!-- Control buttons -->
<button onclick="connectMicrobit()">🔵 Connect micro:bit</button>
<button onclick="startAI()">📷 Start AI</button>

<br><br>
<!-- Testing buttons -->
<button onclick="sendCmd('F')">Send F</button>
<button onclick="sendCmd('L')">Send L</button>
<button onclick="sendCmd('R')">Send R</button>
<button onclick="sendCmd('S')">Send S</button>
<br><br>

<p id="status">Status: Not connected</p>
<p id="result">---</p>

<!-- TensorFlow + Teachable Machine -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>
// --------------------------------------------------
// CONFIG
// --------------------------------------------------
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/ie3j8Y26K/";

const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const UART_TX      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

let device = null;
let txChar = null;
let model, webcam;

// --------------------------------------------------
// BLE WRITE QUEUE
// --------------------------------------------------
let bleQueue = [];
let bleBusy = false;

function queueBLE(message) {
  bleQueue.push(message + "#");  // micro:bit uses "#" delimiter
  processBLE();
}

async function processBLE() {
  if (bleBusy || bleQueue.length === 0 || !txChar) return;

  bleBusy = true;
  const msg = bleQueue.shift();

  try {
    // micro:bit UART requires write without response
    await txChar.writeValueWithoutResponse(new TextEncoder().encode(msg));
    console.log("SEND:", msg);
  } catch (e) {
    console.warn("BLE Write Error:", e);
  }

  setTimeout(() => {
    bleBusy = false;
    processBLE();
  }, 150); // delay between commands
}


// --------------------------------------------------
// CONNECT micro:bit
// --------------------------------------------------
async function connectMicrobit() {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "BBC micro:bit" }],
      optionalServices: [UART_SERVICE]
    });

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(UART_SERVICE);
    txChar = await service.getCharacteristic(UART_TX);

    document.getElementById("status").innerText = "Connected ✔ UART Ready";
    console.log("Bluetooth Ready");

  } catch (err) {
    document.getElementById("status").innerText = "Connect Error: " + err;
    console.error("Connect Error:", err);
  }
}


// --------------------------------------------------
// LOAD MODEL + START CAMERA
// --------------------------------------------------
async function startAI() {
  document.getElementById("status").innerText = "Loading model...";

  await tf.ready();

  model = await tmImage.load(
    MODEL_URL + "model.json",
    MODEL_URL + "metadata.json"
  );

  document.getElementById("status").innerText = "Model loaded · Starting Camera...";

  webcam = new tmImage.Webcam(300, 300, true);
  await webcam.setup();
  await webcam.play();
  document.body.appendChild(webcam.canvas);

  loop();
}


// --------------------------------------------------
// AI LOOP
// --------------------------------------------------
async function loop() {
  webcam.update();

  const prediction = await model.predict(webcam.canvas);

  const best = prediction.reduce((a, b) =>
    a.probability > b.probability ? a : b
  );

  document.getElementById("result").innerText =
    `${best.className} : ${best.probability.toFixed(2)}`;

  sendCmd(best.className);

  requestAnimationFrame(loop);
}


// --------------------------------------------------
// SEND COMMAND TO micro:bit
// --------------------------------------------------
function sendCmd(label) {
  if (!txChar || !device.gatt.connected) return;

  let cmd = "S";

  if (label === "HandUp") cmd = "F";
  else if (label === "HandLeft") cmd = "L";
  else if (label === "HandRight") cmd = "R";

  queueBLE(cmd);
}
</script>

</body>
</html>
