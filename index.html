<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>AI Trash Bin (Pose)</title>
</head>
<body>

<h2>AI Trash Bin – Pose Control</h2>

<button onclick="connect()">🔵 Connect micro:bit</button>
<button onclick="init()">📷 Start Camera</button>

<p id="result">---</p>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

<script>
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/x3r1TSRf3/";
let model, webcam, ctx, characteristic;

// ---------- Bluetooth ----------
async function connect() {
  const device = await navigator.bluetooth.requestDevice({
    filters: [{ namePrefix: "BBC micro:bit" }],
    optionalServices: [0xFFE0]
  });

  const server = await device.gatt.connect();
  const service = await server.getPrimaryService(0xFFE0);
  characteristic = await service.getCharacteristic(0xFFE1);

  document.getElementById("result").innerText = "Bluetooth Connected";
}

function send(cmd) {
  if (characteristic)
    characteristic.writeValue(new TextEncoder().encode(cmd + "\n"));
}

// ---------- Pose AI ----------
async function init() {
  model = await tmPose.load(
    MODEL_URL + "model.json",
    MODEL_URL + "metadata.json"
  );

  webcam = new tmPose.Webcam(300, 300, true);
  await webcam.setup();
  await webcam.play();

  const canvas = document.createElement("canvas");
  canvas.width = 300;
  canvas.height = 300;
  ctx = canvas.getContext("2d");

  document.body.appendChild(webcam.canvas);
  document.body.appendChild(canvas);

  loop();
}

async function loop() {
  webcam.update();

  const { pose, posenetOutput } =
    await model.estimatePose(webcam.canvas);

  const prediction =
    await model.predict(posenetOutput);

  ctx.drawImage(webcam.canvas, 0, 0);
  if (pose) tmPose.drawPose(pose, ctx);

  let best = prediction.reduce((a,b)=>
    a.probability > b.probability ? a : b
  );

  document.getElementById("result").innerText =
    best.className + " " + best.probability.toFixed(2);

  if (best.className === "HandUp") send("F");
  else if (best.className === "HandLeft") send("L");
  else if (best.className === "HandRight") send("R");
  else send("S");

  requestAnimationFrame(loop);
}
</script>

</body>
</html>
