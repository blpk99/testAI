<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AI + micro:bit Controller</title>
</head>
<body>

<h2>AI + micro:bit Controller</h2>

<button onclick="connectMicrobit()">🔵 Connect micro:bit</button>
<button onclick="startAI()">📷 Start AI</button>

<button onclick="sendCmd('F')">Send F</button>
<button onclick="sendCmd('L')">Send L</button>
<button onclick="sendCmd('R')">Send R</button>

<p id="status">Status: Not connected</p>
<div id="log" style="background:#111;color:#0f0;height:150px;overflow:auto;padding:10px"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>

<!-- ✔ เวอร์ชันที่รองรับ tmImage แบบ Global -->
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>
const MODEL = "https://teachablemachine.withgoogle.com/models/ie3j8Y26K/";

let model;
let txChar = null;

const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const UART_RX      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";  // write only

function log(t){
  const box=document.getElementById("log");
  box.innerText+=t+"\n";
  box.scrollTop=box.scrollHeight;
}

/* CONNECT micro:bit */
async function connectMicrobit() {
  try {
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix:"BBC micro:bit" }],
      optionalServices: [UART_SERVICE]
    });

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(UART_SERVICE);
    txChar = await service.getCharacteristic(UART_RX);

    document.getElementById("status").innerText = "Connected ✓";
    log("Connected to micro:bit");

  } catch (err) {
    log("Connect Error: " + err);
  }
}

/* LOAD MODEL */
async function startAI() {
  try {
    model = await tmImage.load(MODEL + "model.json", MODEL + "metadata.json");
    log("Model loaded!");

  } catch (err) {
    log("Load model error: " + err);
    return;
  }
}

/* SEND COMMAND */
function sendCmd(cmd) {
  if (!txChar) return log("Not connected!");

  let data = new TextEncoder().encode(cmd + "\n");

  txChar.writeValueWithoutResponse(data)
    .then(() => log("Sent: " + cmd))
    .catch(err => log("Write ERR: " + err));
}
</script>

</body>
</html>
