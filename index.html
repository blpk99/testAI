<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI + Bluetooth micro:bit Controller</title>
<style>
body { font-family: Arial; }
#log {
    width: 100%;
    height: 200px;
    background: #000;
    color: #0f0;
    padding: 10px;
    overflow-y: scroll;
    white-space: pre-wrap;
}
button { padding:10px; margin:5px; }
</style>
</head>
<body>

<h2>AI Trash Bin – Image + Bluetooth (Stable)</h2>

<button id="connectBtn">🔵 Connect micro:bit</button>
<button id="startAI">📷 Start Camera + AI</button>

<div id="status"></div>
<div id="log"></div>

<video id="video" width="320" height="240" autoplay playsinline></video>
<canvas id="canvas" width="320" height="240" style="display:none;"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.14.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8"></script>

<script>
/* --------------------------------------------------------------------------
   AI MODEL SETTINGS
-------------------------------------------------------------------------- */
const modelURL = "https://teachablemachine.withgoogle.com/models/xxxxxx/model.json";
const metadataURL = "https://teachablemachine.withgoogle.com/models/xxxxxx/metadata.json";

let model, maxPredictions;

/* --------------------------------------------------------------------------
   LOAD MODEL
-------------------------------------------------------------------------- */
async function loadModel() {
    document.getElementById("status").innerHTML = "Loading AI Model...";
    model = await tmImage.load(modelURL, metadataURL);
    maxPredictions = model.getTotalClasses();
    document.getElementById("status").innerHTML = "AI Ready! Starting camera...";
    startCamera();
}

/* --------------------------------------------------------------------------
   CAMERA
-------------------------------------------------------------------------- */
async function startCamera() {
    const video = document.getElementById("video");
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    predictLoop();
}

/* --------------------------------------------------------------------------
   PREDICT LOOP
-------------------------------------------------------------------------- */
async function predictLoop() {
    const video = document.getElementById("video");
    const prediction = await model.predict(video);

    prediction.forEach(p => {
        if (p.className === "HandUp" && p.probability > 0.8) {
            document.getElementById("status").innerHTML = "HandUp : " + p.probability.toFixed(2);
            sendCmd("F");
        }
    });

    requestAnimationFrame(predictLoop);
}

/* --------------------------------------------------------------------------
   BLUETOOTH UUID (micro:bit UART Nordic)
-------------------------------------------------------------------------- */
const UART_SERVICE  = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const UART_TX       = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const UART_RX       = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

/* --------------------------------------------------------------------------
   BLE VARIABLES
-------------------------------------------------------------------------- */
let bleDevice = null;
let bleServer = null;
let bleTxCharacteristic = null;
let bleRxCharacteristic = null;

let busy = false;
let queue = [];

/* --------------------------------------------------------------------------
   CONNECT MICROBIT
-------------------------------------------------------------------------- */
async function connectMicrobit() {
    try {
        log("Requesting micro:bit...");
        bleDevice = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: "BBC" }],
            optionalServices: [UART_SERVICE],
        });

        bleDevice.addEventListener("gattserverdisconnected", onDisconnected);

        log("Connecting...");
        bleServer = await bleDevice.gatt.connect();

        const service = await bleServer.getPrimaryService(UART_SERVICE);
        bleTxCharacteristic = await service.getCharacteristic(UART_TX);
        bleRxCharacteristic = await service.getCharacteristic(UART_RX);

        await bleRxCharacteristic.startNotifications();
        bleRxCharacteristic.addEventListener("characteristicvaluechanged", handleRx);

        log("micro:bit Connected ✔ UART Ready");
    } catch (error) {
        log("Connect error: " + error);
    }
}

/* --------------------------------------------------------------------------
   RECEIVE DATA FROM microbit
-------------------------------------------------------------------------- */
function handleRx(event) {
    let text = new TextDecoder().decode(event.target.value);
    log("RX: " + text);
}

/* --------------------------------------------------------------------------
   SEND COMMAND (WITH QUEUE)
-------------------------------------------------------------------------- */
function sendCmd(cmd) {
    queue.push(cmd + "\n");
    processSendQueue();
}

async function processSendQueue() {
    if (busy || queue.length === 0 || !bleTxCharacteristic) return;

    busy = true;
    let msg = queue.shift();
    log("SEND: " + msg);

    try {
        await bleTxCharacteristic.writeValue(new TextEncoder().encode(msg));
    } catch (err) {
        log("Write Error: " + err);
    }

    setTimeout(() => {
        busy = false;
        processSendQueue();
    }, 150);
}

/* --------------------------------------------------------------------------
   DISCONNECTED HANDLER
-------------------------------------------------------------------------- */
function onDisconnected() {
    log("Disconnected ❌");
}

/* --------------------------------------------------------------------------
   LOG FUNCTION
-------------------------------------------------------------------------- */
function log(txt) {
    let logDiv = document.getElementById("log");
    logDiv.textContent += txt + "\n";
    logDiv.scrollTop = logDiv.scrollHeight;
}

/* --------------------------------------------------------------------------
   BUTTON HANDLERS
-------------------------------------------------------------------------- */
document.getElementById("connectBtn").onclick = connectMicrobit;
document.getElementById("startAI").onclick = loadModel;

</script>
</body>
</html>
