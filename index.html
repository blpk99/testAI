<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gesture Tester (Final)</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; text-align: center; padding: 20px; background-color: #f0f2f5; }
        h2 { color: #333; }
        button { 
            padding: 15px 30px; 
            font-size: 18px; 
            margin: 10px; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: 0.3s; 
            color: white; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        .btn-blue { background-color: #007bff; }
        .btn-green { background-color: #28a745; }
        .btn-blue:hover { background-color: #0056b3; }
        .btn-green:hover { background-color: #218838; }
        
        #status { margin-top: 20px; font-weight: bold; color: #555; }
        #result-box {
            background: white;
            padding: 20px;
            margin: 20px auto;
            border-radius: 15px;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #result-text { font-size: 24px; font-weight: bold; color: #d9534f; }
        #sent-cmd { color: #888; font-size: 14px; margin-top: 5px; }
        canvas { border-radius: 10px; margin-top: 10px; width: 100%; max-width: 350px; }
    </style>
</head>
<body>

    <h2>🤖 ทดสอบการส่งค่า AI -> Micro:bit</h2>

    <button class="btn-blue" onclick="connectMicrobit()">1. เชื่อมต่อ Bluetooth</button>
    <button class="btn-green" onclick="startAI()">2. เปิดกล้อง AI</button>

    <div id="status">สถานะ: รอการเชื่อมต่อ...</div>

    <div id="result-box">
        <div>ผลลัพธ์จาก AI:</div>
        <div id="result-text">-</div>
        <div id="sent-cmd">ค่าที่ส่งไป Micro:bit: -</div>
    </div>

    <div id="webcam-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

    <script>
        // ---------------- ตั้งค่า MODEL ตรงนี้ ----------------
        const MODEL_URL = "https://teachablemachine.withgoogle.com/models/ie3j8Y26K/"; 
        // --------------------------------------------------

        const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_TX      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

        let device, txChar;
        let model, webcam, maxPredictions;
        let isConnected = false;
        let lastSent = ""; 
        let stopCounter = 0; 

        async function connectMicrobit() {
            try {
                document.getElementById("status").innerText = "กำลังค้นหา Micro:bit...";
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "BBC micro:bit" }],
                    optionalServices: [UART_SERVICE]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE);
                txChar = await service.getCharacteristic(UART_TX);

                isConnected = true;
                document.getElementById("status").innerText = "✅ เชื่อมต่อสำเร็จ! พร้อมรับคำสั่ง";
                document.getElementById("status").style.color = "green";
            } catch (err) {
                console.error(err);
                document.getElementById("status").innerText = "❌ การเชื่อมต่อล้มเหลว (ลองใหม่)";
            }
        }

        async function startAI() {
            if (!model) {
                document.getElementById("status").innerText = "กำลังโหลด Model...";
                const modelURL = MODEL_URL + "model.json";
                const metadataURL = MODEL_URL + "metadata.json";
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();
            }

            const flip = true; 
            webcam = new tmImage.Webcam(300, 300, flip);
            await webcam.setup();
            await webcam.play();
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            
            document.getElementById("status").innerText = "📸 กล้องทำงานแล้ว!";
            window.requestAnimationFrame(loop);
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            let highestProb = 0;
            let bestClass = "";
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProb) {
                    highestProb = prediction[i].probability;
                    bestClass = prediction[i].className;
                }
            }

            document.getElementById("result-text").innerText = `${bestClass} (${(highestProb * 100).toFixed(0)}%)`;

            // Logic การส่งค่า + หน่วงเวลาหยุด
            if (highestProb > 0.85) { 
                stopCounter = 0;
                if (bestClass === "HandUp") sendCmd("F");
                else if (bestClass === "HandLeft") sendCmd("L");
                else if (bestClass === "HandRight") sendCmd("R");
            } else {
                stopCounter++;
                if (stopCounter > 10) { 
                    sendCmd("S");
                    stopCounter = 0; 
                }
            }
        }

        async function sendCmd(cmd) {
            if (!isConnected || !txChar) return;
            if (cmd === lastSent) return; 

            try {
                // 🌟🌟🌟 แก้ตรงนี้ครับ เปลี่ยน # เป็น \n เพื่อให้ตรงกับ Micro:bit 🌟🌟🌟
               // แก้เป็นตัวนี้ครับ (ใช้ $ ต่อท้าย)
                let message = cmd + "#"; 
                // -------------------------------------------------------------
                
                let encoder = new TextEncoder();
                await txChar.writeValueWithoutResponse(encoder.encode(message));
                
                lastSent = cmd;
                document.getElementById("sent-cmd").innerText = "ค่าที่ส่งไป Micro:bit: " + cmd;
                console.log("Sent:", cmd);
            } catch (err) {
                console.error("Send error:", err);
            }
        }
    </script>

</body>
</html>
