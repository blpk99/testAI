<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI + micro:bit Bluetooth Controller</title>
<style>
body { font-family: Arial; }
button { padding:8px 14px; margin:5px; }
#log {
    width: 100%; height: 180px; background:#000; color:#0f0;
    padding:10px; overflow-y:scroll; white-space:pre-wrap;
}
</style>
</head>
<body>

<h2>AI + micro:bit Controller</h2>

<button onclick="connectMicrobit()">🔵 Connect micro:bit</button>
<button onclick="startAI()">📷 Start AI</button>

<button onclick="sendCmd('F')">Send F</button>
<button onclick="sendCmd('L')">Send L</button>
<button onclick="sendCmd('R')">Send R</button>

<p id="status">Status: Not connected</p>
<video id="video" width="320" height="240" autoplay playsinline></video>

<div id="log"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@1.1/dist/teachablemachine-image.min.js"></script>

<script>
const modelURL = "https://teachablemachine.withgoogle.com/models/ie3j8Y26K/model.json";
const metadataURL = "https://teachablemachine.withgoogle.com/models/ie3j8Y26K/metadata.json";

let model;
let txChar = null;

const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const UART_RX      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // write
const UART_TX      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // notify

/* -------- CONNECT -------- */
async function connectMicrobit() {
    try {
        const device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: "BBC micro:bit" }],
            optionalServices: [UART_SERVICE]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(UART_SERVICE);

        txChar = await service.getCharacteristic(UART_RX);

        document.getElementById("status").innerText = "Connected ✓";
        log("Connected");

    } catch (err) {
        log("Connect Error: " + err);
    }
}

/* -------- LOAD MODEL -------- */
async function startAI() {
    model = await window.tmImage.load(modelURL, metadataURL); // ✔ FIXED
    log("Model loaded!");
    startCamera();
}

/* -------- CAMERA -------- */
async function startCamera() {
    const video = document.getElementById("video");
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    predictLoop();
}

/* -------- AI LOOP -------- */
async function predictLoop() {
    const prediction = await model.predict(video);

    prediction.forEach(p => {
        if (p.className === "HandUp" && p.probability > 0.80) sendCmd("F");
        if (p.className === "HandLeft" && p.probability > 0.80) sendCmd("L");
        if (p.className === "HandRight" && p.probability > 0.80) sendCmd("R");
    });

    requestAnimationFrame(predictLoop);
}

/* -------- SEND COMMAND -------- */
function sendCmd(cmd) {
    if (!txChar) return log("Not Connected!");

    let data = new TextEncoder().encode(cmd + "\n");

    txChar.writeValueWithoutResponse(data)
        .then(() => log("SEND: " + cmd))
        .catch(err => log("Write Error: " + err));
}

/* -------- LOGGER -------- */
function log(t) {
    const box = document.getElementById("log");
    box.textContent += t + "\n";
    box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
