<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Trash Bin – Bluetooth + AI</title>
  <style>
    button { margin: 5px; padding: 10px 20px; font-size: 16px; }
  </style>
</head>

<body>

<h2>AI Trash Bin – AI + micro:bit Bluetooth</h2>

<button onclick="connectMicrobit()">🔵 Connect micro:bit</button>
<button onclick="startAI()">📷 Start AI</button>

<button onclick="sendCmd('F')">Test F</button>
<button onclick="sendCmd('L')">Test L</button>
<button onclick="sendCmd('R')">Test R</button>
<button onclick="sendCmd('S')">Test S</button>

<p id="status">Status: Not connected</p>
<p id="result">---</p>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>
// --------------------------------------------------
// CONFIG
// --------------------------------------------------
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/ie3j8Y26K/";

// UART UUID
const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const UART_RX =      "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // write
const UART_TX =      "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // notify

let device = null;
let rxChar = null;
let txChar = null;
let model, webcam;

// BLE Queue
let bleQueue = [];
let bleBusy = false;

// --------------------------------------------------
// BLE QUEUE
// --------------------------------------------------
function queueBLE(message) {
  bleQueue.push(message + "#");
  processBLE();
}

async function processBLE() {
  if (bleBusy || bleQueue.length === 0 || !rxChar) return;

  bleBusy = true;
  const msg = bleQueue.shift();

  try {
    await rxChar.writeValue(new TextEncoder().encode(msg));
    console.log("SEND:", msg);
  } catch (e) {
    console.error("BLE Write Error:", e);
  }

  setTimeout(() => {
    bleBusy = false;
    processBLE();
  }, 120);
}

// --------------------------------------------------
// CONNECT MICROBIT
// --------------------------------------------------
async function connectMicrobit() {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "BBC micro:bit" }],
      optionalServices: [UART_SERVICE]
    });

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(UART_SERVICE);

    rxChar = await service.getCharacteristic(UART_RX); // write
    txChar = await service.getCharacteristic(UART_TX); // notify

    await txChar.startNotifications();
    txChar.addEventListener("characteristicvaluechanged", event => {
      const value = new TextDecoder().decode(event.target.value);
      console.log("MICROBIT:", value);
    });

    document.getElementById("status").innerText = "Connected ✔ Ready";

  } catch (err) {
    document.getElementById("status").innerText = "Connect Error: " + err;
    console.error(err);
  }
}

// --------------------------------------------------
// START AI
// --------------------------------------------------
async function startAI() {
  document.getElementById("status").innerText = "Loading model...";

  await tf.ready();
  model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");

  webcam = new tmImage.Webcam(300, 300, true);
  await webcam.setup();
  await webcam.play();
  document.body.appendChild(webcam.canvas);

  loop();
}

// --------------------------------------------------
// AI LOOP
// --------------------------------------------------
async function loop() {
  webcam.update();

  const prediction = await model.predict(webcam.canvas);
  const best = prediction.reduce((a, b) => a.probability > b.probability ? a : b);

  document.getElementById("result").innerText =
    `${best.className} : ${best.probability.toFixed(2)}`;

  sendCmd(best.className);
  requestAnimationFrame(loop);
}

// --------------------------------------------------
// SEND CMD TO MICROBIT
// --------------------------------------------------
function sendCmd(label) {
  if (!rxChar || !device.gatt.connected) return;

  let cmd = "S";
  if (label === "HandUp") cmd = "F";
  else if (label === "HandLeft") cmd = "L";
  else if (label === "HandRight") cmd = "R";

  queueBLE(cmd);
}
</script>

</body>
</html>
