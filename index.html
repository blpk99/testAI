<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Trash Bin – Image Control</title>
</head>
<body>

<h2>AI Trash Bin – Image Control</h2>

<button onclick="connect()">🔵 Connect micro:bit</button>
<button onclick="startAI()">📷 Start Camera</button>

<p id="result">---</p>

<!-- ใช้ TFJS เวอร์ชันที่รองรับ TM Image -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<script>

const MODEL_URL = "https://teachablemachine.withgoogle.com/models/ie3j8Y26K/"; 
let model, webcam, characteristic;

let lastCmd = "";
let lastSendTime = 0;

// ------------ Bluetooth ------------
async function connect() {
  const device = await navigator.bluetooth.requestDevice({
    filters: [{ namePrefix: "BBC micro:bit" }],
    optionalServices: [0xFFE0]
  });

  const server = await device.gatt.connect();
  const service = await server.getPrimaryService(0xFFE0);
  characteristic = await service.getCharacteristic(0xFFE1);

  document.getElementById("result").innerText = "Bluetooth Connected";
}

// ------------ Start Camera + AI ------------
async function startAI() {
  await tf.ready();

  model = await tmImage.load(
    MODEL_URL + "model.json",
    MODEL_URL + "metadata.json"
  );

  webcam = new tmImage.Webcam(300, 300, true);
  await webcam.setup();
  await webcam.play();

  document.body.appendChild(webcam.canvas);

  loop();
}

async function loop() {
  webcam.update();
  const prediction = await model.predict(webcam.canvas);

  let best = prediction.reduce((a, b) =>
    a.probability > b.probability ? a : b
  );

  document.getElementById("result").innerText =
    best.className + " : " + best.probability.toFixed(2);

  sendCommand(best.className);

  requestAnimationFrame(loop);
}

// ------------ ส่งคำสั่งไป micro:bit ------------
function sendCommand(label) {
  if (!characteristic) return;

  let cmd = "S";

  if (label === "HandUp") cmd = "F";
  else if (label === "HandLeft") cmd = "L";
  else if (label === "HandRight") cmd = "R";
  else cmd = "S";

  // กันการส่งซ้ำเร็วเกิน
  const now = Date.now();
  if (cmd !== lastCmd || now - lastSendTime > 500) {
    characteristic.writeValue(new TextEncoder().encode(cmd));
    lastCmd = cmd;
    lastSendTime = now;
  }
}

</script>
</body>
</html>
