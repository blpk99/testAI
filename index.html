<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Micro:bit</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; text-align: center; padding: 10px; background-color: #eee; }
        button { 
            width: 100%; max-width: 400px; padding: 15px; font-size: 20px; 
            margin: 10px auto; border: none; border-radius: 10px; color: white; cursor: pointer;
        }
        .btn-blue { background: #007bff; }
        .btn-yellow { background: #ffc107; color: black; font-weight: bold; }
        .btn-red { background: #dc3545; }
        
        #log-box {
            width: 95%; height: 200px; background: #000; color: #0f0; 
            font-family: monospace; text-align: left; padding: 10px; 
            margin: 10px auto; overflow-y: scroll; border-radius: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h3>🛠️ Debug Mode (เช็ค Error)</h3>

    <button class="btn-blue" onclick="connectMicrobit()">1. เชื่อมต่อ Bluetooth</button>
    <button class="btn-yellow" onclick="sendCmd('F')">📡 กดส่ง F (ทดสอบ)</button>
    <button class="btn-red" onclick="disconnect()">❌ ตัดการเชื่อมต่อ</button>

    <div id="status">สถานะ: ยังไม่เชื่อมต่อ</div>
    
    <div id="log-box">System Ready...</div>

    <script>
        const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_TX      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

        let device, txChar, server;

        function log(msg) {
            const box = document.getElementById("log-box");
            const time = new Date().toLocaleTimeString();
            box.innerHTML += `<div>[${time}] ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        async function connectMicrobit() {
            try {
                log("🔍 กำลังค้นหา Micro:bit...");
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "BBC micro:bit" }],
                    optionalServices: [UART_SERVICE]
                });

                log("🔗 กำลังเชื่อมต่อ GATT...");
                server = await device.gatt.connect();

                log("📂 กำลังหา Service...");
                const service = await server.getPrimaryService(UART_SERVICE);

                log("📝 กำลังหา Characteristic...");
                txChar = await service.getCharacteristic(UART_TX);

                log("✅ เชื่อมต่อสำเร็จ! รอ 1 วินาที...");
                document.getElementById("status").innerText = "✅ Connected";
                
                // รอ 1 วินาที ให้ Android ตั้งหลัก
                await new Promise(r => setTimeout(r, 1000));
                sendCmd("S");

            } catch (err) {
                log("❌ Error: " + err); // ถ่ายรูปตรงนี้มาให้ผมดูได้ครับ
            }
        }

        async function sendCmd(cmd) {
            if (!txChar) { log("⚠️ ยังไม่ได้เชื่อมต่อ!"); return; }
            try {
                let message = cmd + "#"; 
                let encoder = new TextEncoder();
                log(`📤 กำลังส่ง: ${message}`);
                
                // ลองส่งแบบ WriteWithoutResponse
                await txChar.writeValueWithoutResponse(encoder.encode(message));
                
                log(`✅ ส่งสำเร็จ!`);
            } catch (err) {
                log("❌ ส่งพลาด: " + err);
            }
        }
        
        function disconnect() {
            if (device && device.gatt.connected) {
                device.gatt.disconnect();
                log("Disconnected.");
                document.getElementById("status").innerText = "❌ Disconnected";
            }
        }
    </script>
</body>
</html>
