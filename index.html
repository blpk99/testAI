<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>AI Trash Bin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <h2>🗑️ AI Trash Bin</h2>

  <button onclick="connect()">🔵 Connect micro:bit</button>
  <p id="status">Status: Not connected</p>
  <p id="result">---</p>

  <!-- TensorFlow + Teachable Machine -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image"></script>

<script>
let model;
let characteristic;
let webcam;

const MODEL_URL = "https://teachablemachine.withgoogle.com/models/x3r1TSRf3/";
const THRESHOLD = 0.80;   // ความมั่นใจ 80%

// ================= Bluetooth =================
async function connect() {
  try {
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "BBC micro:bit" }],
      optionalServices: [0xFFE0]
    });

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(0xFFE0);
    characteristic = await service.getCharacteristic(0xFFE1);

    document.getElementById("status").innerText = "Status: Connected ✅";
    await loadModel();

  } catch (err) {
    alert("Bluetooth error: " + err);
  }
}

// ================= Load AI =================
async function loadModel() {
  model = await tmImage.load(
    MODEL_URL + "model.json",
    MODEL_URL + "metadata.json"
  );
  startCamera();
}

// ================= Camera =================
async function startCamera() {
  webcam = new tmImage.Webcam(224, 224, true);
  await webcam.setup();      // ขอสิทธิ์กล้อง
  await webcam.play();

  document.body.appendChild(webcam.canvas);
  window.requestAnimationFrame(loop);
}

// ================= AI Loop =================
async function loop() {
  webcam.update();
  const predictions = await model.predict(webcam.canvas);

  // ใช้คลาสที่มีค่ามากที่สุด
  let best = predictions[0];
  for (let p of predictions) {
    if (p.probability > best.probability) best = p;
  }

  document.getElementById("result").innerText =
    best.className + " : " + (best.probability * 100).toFixed(1) + "%";

  if (best.className === "HandUp" && best.probability > THRESHOLD) {
    send("F");   // เดินหน้า
  } else {
    send("S");   // หยุด
  }

  requestAnimationFrame(loop);
}

// ================= Send Command =================
function send(cmd) {
  if (!characteristic) return;
  const data = new TextEncoder().encode(cmd);
  characteristic.writeValue(data);
}
</script>
</body>
</html>
